[tool.poetry]
name = "pythonproject"
version = "0.1.0"
description = ""
authors = ["Ангелина Павленко <angel-ina@mail.ru>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "pythonproject", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.11"
pytest = "^8.0"


[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --color=yes"

