[build-system]
requires = ["setuptools>=45.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "pythonproject"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.7"  # Рекомендуется >=3.7, а не 2.7
authors = [
    {name = "Ангелина Павленко", email = "angel-ina@mail.ru"}
]
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --color=yes"

